<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Agent Monitor{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .card { @apply bg-white rounded-xl shadow-sm border border-gray-100 p-5; }
        .badge-allow { @apply bg-green-100 text-green-800 px-2 py-1 rounded-full text-xs font-medium; }
        .badge-review { @apply bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full text-xs font-medium; }
        .badge-block { @apply bg-red-100 text-red-800 px-2 py-1 rounded-full text-xs font-medium; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-slate-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">🛡️</span>
                    <span class="font-bold text-lg">AI Agent Monitor</span>
                    <span class="text-xs bg-blue-600 px-2 py-0.5 rounded">KYA</span>
                </div>
                <div class="hidden md:flex space-x-1">
                    <a href="/" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 {% if request.url.path == '/' %}bg-slate-700{% endif %}">Dashboard</a>
                    <a href="/submit" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 {% if request.url.path == '/submit' %}bg-slate-700{% endif %}">Submit Action</a>
                    <a href="/actions" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 {% if request.url.path == '/actions' %}bg-slate-700{% endif %}">Lịch sử</a>
                    <a href="/agents" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 {% if request.url.path == '/agents' %}bg-slate-700{% endif %}">Agents</a>
                    <a href="/test-lab" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 {% if request.url.path == '/test-lab' %}bg-slate-700{% endif %}">Test Lab</a>
                    <a href="/fx" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700">FX Trading</a>
                    <a href="/docs" target="_blank" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700">API Docs</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-gray-400 text-sm py-6">
        AI Agent Monitor • KYA + Anti-Bot + LLM Critic
    </footer>
</body>
</html>
